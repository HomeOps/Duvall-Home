- platform: group
  name: all
  services:
    - service: pushover
      data_template:
        message: '{{ message }}'
        title: "Broadcast Notification"
        data:
          url: "https://duvall.calvonet.com/"
          sound: pianobar
          priority: 0
          #attachment: "http://example.com/image.png"
    - service: tts_google_translate_say
      data_template:
        entity_id: media_player.kitchen_display
        message: '{{ message }}'
        cache: true
- platform: rest
  name: sms
  # Add-on path disabled: libGammu does not recognise this modem's SMS prompt,
  # so every send times out. Fix pending: https://github.com/gammu/gammu/pull/1177
  # To roll back: uncomment the four lines below, delete the resource line that
  # follows them, and disable the "SMS via if06" automation.
  # resource: !secret sms_gateway
  # authentication: basic
  # username: !secret sms_gateway_user
  # password: !secret sms_gateway_password
  resource: http://127.0.0.1:8123/api/webhook/sms_if06
  method: POST_JSON
  target_param_name: number
  message_param_name: text
- platform: group
  name: sms_oscar
  services:
    - service: sms
      data:
        target: !secret sms_oscar
- platform: group
  name: sms_hazel
  services:
    - service: sms
      data:
        target: !secret sms_hazel
